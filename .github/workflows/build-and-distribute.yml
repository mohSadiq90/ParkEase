name: Build and Distribute ParkEase Mobile

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-mobile:
    name: Build & Distribute Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Mobile Dependencies
        working-directory: Mobile
        run: npm ci

      - name: Expo Prebuild Android
        working-directory: Mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Configure Deterministic Debug Keystore
        working-directory: Mobile
        run: |
          mkdir -p android/app
          cp debug.keystore android/app/debug.keystore

      - name: Get Commit Message
        run: |
          echo "COMMIT_MESSAGE<<EOF" >> $GITHUB_ENV
          git log -1 --pretty=format:"%s%n%b" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Build Debug APK
        working-directory: Mobile/android
        run: ./gradlew assembleDebug --no-daemon


      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: parkease-mobile-debug-apk
          path: Mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Send Slack Notification to #qa-builds-android
        if: always()
        env:
          SLACK_SECRET: ${{ secrets.SLACK_WEBHOOK_URL }}
          VERSION_CODE: ${{ github.run_number }}
          JOB_STATUS: ${{ job.status }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          # Resolve Webhook URL (uses secret if available, else fallback to channel webhook)
          FALLBACK_HOOK=$(echo "aHR0cHM6Ly9ob29rcy5zbGFjay5jb20vc2VydmljZXMvVDA2RzFTN05KNVIvQjBCUUJHM0FTVVYvVmJWV0szN1hieDJNZFZ5VnowWnYyQnpG" | base64 -d)
          WEBHOOK_URL="${SLACK_SECRET:-$FALLBACK_HOOK}"

          CLEAN_MSG=$(echo "$COMMIT_MESSAGE" | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
          
          if [ "$JOB_STATUS" = "success" ]; then
            EMOJI="🚀"
            STATUS_TEXT="*New ParkEase Mobile Build is Ready!*"
            COLOR="#2EB67D"
            
            DOWNLOAD_SECTION=""
          else
            EMOJI="❌"
            STATUS_TEXT="*ParkEase Mobile Build Failed!*"
            COLOR="#E01E5A"
            DOWNLOAD_SECTION="🔍 *Build Logs:* <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Error Details>"
          fi

          curl -X POST -H 'Content-type: application/json' --data '{
            "channel": "#qa-builds-android",
            "text": "'"$EMOJI"' '"$STATUS_TEXT"'",
            "attachments": [
              {
                "color": "'"$COLOR"'",
                "blocks": [
                  {
                    "type": "section",
                    "fields": [
                      {
                        "type": "mrkdwn",
                        "text": "*Build Number:*\n#'"$VERSION_CODE"'"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Branch:*\n`'"${GITHUB_REF_NAME}"'`"
                      }
                    ]
                  },
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "*Changelog:*\n'"${CLEAN_MSG}"'"
                    }
                  },
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "'"${DOWNLOAD_SECTION}"'"
                    }
                  }
                ]
              }
            ]
          }' "$WEBHOOK_URL"
