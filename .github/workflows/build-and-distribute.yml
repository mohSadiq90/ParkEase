name: Build and Distribute ParkEase Mobile

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-mobile:
    name: Build & Distribute Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Mobile Dependencies
        working-directory: Mobile
        run: npm ci

      - name: Expo Prebuild Android
        working-directory: Mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Get Commit Message
        run: |
          echo "COMMIT_MESSAGE<<EOF" >> $GITHUB_ENV
          git log -1 --pretty=format:"%s%n%b" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Build Debug APK
        working-directory: Mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: parkease-mobile-debug-apk
          path: Mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Generate Direct Download Link
        id: generate_link
        run: |
          APK_PATH="Mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            RESPONSE=$(curl -s -F "file=@$APK_PATH" https://file.io)
            DIRECT_LINK=$(echo $RESPONSE | grep -o '"link":"[^"]*' | cut -d'"' -f4 || echo "")
            echo "DIRECT_LINK=$DIRECT_LINK" >> $GITHUB_ENV
          fi

      - name: Send Slack Notification
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          VERSION_CODE: ${{ github.run_number }}
          JOB_STATUS: ${{ job.status }}
        run: |
          # If SLACK_WEBHOOK_URL is not set as a repository secret, skip gracefully
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL secret is not set, skipping Slack notification."
            exit 0
          fi

          CLEAN_MSG=$(echo "$COMMIT_MESSAGE" | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
          
          if [ "$JOB_STATUS" = "success" ]; then
            EMOJI="🚀"
            STATUS_TEXT="*New ParkEase Mobile Build is Ready!*"
            COLOR="#2EB67D"
            if [ -n "$DIRECT_LINK" ]; then
              DOWNLOAD_SECTION="🔗 *Direct APK Download:* <${DIRECT_LINK}|Download APK (Expires in 24h)>\n📦 *GitHub Artifacts:* <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Build on GitHub>"
            else
              DOWNLOAD_SECTION="📦 *GitHub Artifacts:* <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Download APK from GitHub Artifacts>"
            fi
          else
            EMOJI="❌"
            STATUS_TEXT="*ParkEase Mobile Build Failed!*"
            COLOR="#E01E5A"
            DOWNLOAD_SECTION="🔍 *Build Logs:* <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Error Details>"
          fi

          curl -X POST -H 'Content-type: application/json' --data '{
            "text": "'"$EMOJI"' '"$STATUS_TEXT"'",
            "attachments": [
              {
                "color": "'"$COLOR"'",
                "blocks": [
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "'"$EMOJI"' '"$STATUS_TEXT"'"
                    }
                  },
                  {
                    "type": "section",
                    "fields": [
                      {
                        "type": "mrkdwn",
                        "text": "*Build Number:*\n#'"$VERSION_CODE"'"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Branch:*\n'"${GITHUB_REF_NAME}"'"
                      }
                    ]
                  },
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "*Changelog:*\n'"${CLEAN_MSG}"'"
                    }
                  },
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "'"${DOWNLOAD_SECTION}"'"
                    }
                  }
                ]
              }
            ]
          }' $SLACK_WEBHOOK_URL
