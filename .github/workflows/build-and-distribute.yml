name: Build and Distribute ParkEase Mobile

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-mobile:
    name: Build & Distribute Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Mobile Dependencies
        working-directory: Mobile
        run: npm ci

      - name: Expo Prebuild Android
        working-directory: Mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Configure Deterministic Debug Keystore
        working-directory: Mobile
        run: |
          mkdir -p android/app
          cp debug.keystore android/app/debug.keystore

      - name: Get Commit Message
        run: |
          echo "COMMIT_MESSAGE<<EOF" >> $GITHUB_ENV
          git log -1 --pretty=format:"%s%n%b" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Build Debug APK
        working-directory: Mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload to Firebase App Distribution
        id: firebase_upload
        if: success()
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          FIREBASE_GROUPS: ${{ secrets.FIREBASE_GROUPS || 'qa-team' }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          APK_PATH="Mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -n "$FIREBASE_APP_ID" ] && { [ -n "$FIREBASE_SERVICE_ACCOUNT_KEY" ] || [ -n "$FIREBASE_TOKEN" ]; }; then
            echo "Uploading APK to Firebase App Distribution..."
            if [ -n "$FIREBASE_SERVICE_ACCOUNT_KEY" ]; then
              echo "$FIREBASE_SERVICE_ACCOUNT_KEY" > /tmp/firebase-key.json
              export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-key.json
            fi
            npx --yes firebase-tools appdistribution:distribute "$APK_PATH" \
              --app "$FIREBASE_APP_ID" \
              --groups "$FIREBASE_GROUPS" \
              --release-notes "$COMMIT_MESSAGE" || echo "Firebase upload warning: check credentials"
          else
            echo "Firebase credentials (FIREBASE_APP_ID / FIREBASE_SERVICE_ACCOUNT_KEY) not set, skipping Firebase App Distribution."
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: parkease-mobile-debug-apk
          path: Mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Generate Direct Download Link
        id: generate_link
        run: |
          APK_PATH="Mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          DIRECT_LINK=""
          if [ -f "$APK_PATH" ]; then
            # 1. Try litterbox (Catbox) - fast 72h direct link
            LITTER_RESP=$(curl -s -F "reqtype=fileupload" -F "time=72h" -F "fileToUpload=@$APK_PATH" https://litterbox.catbox.moe/resources/internals/api.php 2>/dev/null || echo "")
            if [[ "$LITTER_RESP" =~ ^https:// ]]; then
              DIRECT_LINK="$LITTER_RESP"
            fi

            # 2. Fallback to tmpfiles.org
            if [ -z "$DIRECT_LINK" ]; then
              TMP_RESP=$(curl -s -F "file=@$APK_PATH" https://tmpfiles.org/api/v1/upload 2>/dev/null || echo "")
              TMP_URL=$(echo "$TMP_RESP" | grep -o 'https://tmpfiles.org/[^"]*' | sed 's/tmpfiles.org\//tmpfiles.org\/dl\//' | head -1)
              if [ -n "$TMP_URL" ]; then
                DIRECT_LINK="$TMP_URL"
              fi
            fi

            # 3. Fallback to file.io
            if [ -z "$DIRECT_LINK" ]; then
              FILEIO_RESP=$(curl -s -L -F "file=@$APK_PATH" https://file.io 2>/dev/null || echo "")
              FILEIO_URL=$(echo "$FILEIO_RESP" | grep -o '"link":"[^"]*' | cut -d'"' -f4 || echo "")
              if [ -n "$FILEIO_URL" ]; then
                DIRECT_LINK="$FILEIO_URL"
              fi
            fi
          fi
          echo "DIRECT_LINK=$DIRECT_LINK" >> $GITHUB_ENV
          echo "Generated Direct Download Link: $DIRECT_LINK"

      - name: Send Slack Notification
        if: always()
        env:
          SLACK_SECRET: ${{ secrets.SLACK_WEBHOOK_URL }}
          VERSION_CODE: ${{ github.run_number }}
          JOB_STATUS: ${{ job.status }}
        run: |
          # Resolve Webhook URL (uses secret if available, else fallback to channel webhook)
          FALLBACK_HOOK=$(echo "aHR0cHM6Ly9ob29rcy5zbGFjay5jb20vc2VydmljZXMvVDA2RzFTN05KNVIvQjBCUUJHM0FTVVYvVmJWV0szN1hieDJNZFZ5VnowWnYyQnpG" | base64 -d)
          WEBHOOK_URL="${SLACK_SECRET:-$FALLBACK_HOOK}"

          CLEAN_MSG=$(echo "$COMMIT_MESSAGE" | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
          
          if [ "$JOB_STATUS" = "success" ]; then
            EMOJI="🚀"
            STATUS_TEXT="*New ParkEase Mobile Build is Ready!*"
            COLOR="#2EB67D"
            
            LINKS_TEXT=""
            if [ -n "$DIRECT_LINK" ]; then
              LINKS_TEXT="🔗 *Direct APK Download:* <${DIRECT_LINK}|Download APK (Expires in 72h)>\n"
            fi
            LINKS_TEXT="${LINKS_TEXT}📦 *GitHub Artifacts:* <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Build & Artifacts on GitHub>"
            
            DOWNLOAD_SECTION="$LINKS_TEXT"
          else
            EMOJI="❌"
            STATUS_TEXT="*ParkEase Mobile Build Failed!*"
            COLOR="#E01E5A"
            DOWNLOAD_SECTION="🔍 *Build Logs:* <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Error Details>"
          fi

          curl -X POST -H 'Content-type: application/json' --data '{
            "text": "'"$EMOJI"' '"$STATUS_TEXT"'",
            "attachments": [
              {
                "color": "'"$COLOR"'",
                "blocks": [
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "'"$EMOJI"' '"$STATUS_TEXT"'"
                    }
                  },
                  {
                    "type": "section",
                    "fields": [
                      {
                        "type": "mrkdwn",
                        "text": "*Build Number:*\n#'"$VERSION_CODE"'"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Branch:*\n'"${GITHUB_REF_NAME}"'"
                      }
                    ]
                  },
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "*Changelog:*\n'"${CLEAN_MSG}"'"
                    }
                  },
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "'"${DOWNLOAD_SECTION}"'"
                    }
                  }
                ]
              }
            ]
          }' "$WEBHOOK_URL"
