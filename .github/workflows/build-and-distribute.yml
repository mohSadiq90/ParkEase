name: Build and Distribute ParkEase Mobile

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-mobile:
    name: Build & Distribute Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Mobile Dependencies
        working-directory: Mobile
        run: |
          set -o pipefail
          npm ci --legacy-peer-deps 2>&1 | tee npm_install.log

      - name: Expo Prebuild Android
        working-directory: Mobile
        run: |
          set -o pipefail
          npx expo prebuild --platform android --clean --no-install 2>&1 | tee prebuild.log

      - name: Configure Deterministic Debug Keystore
        working-directory: Mobile
        run: |
          mkdir -p android/app
          cp debug.keystore android/app/debug.keystore

      - name: Get Commit Message
        run: |
          echo "COMMIT_MESSAGE<<EOF" >> $GITHUB_ENV
          git log -1 --pretty=format:"%s%n%b" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Build Release APK
        working-directory: Mobile/android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee gradle_build.log

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: parkease-mobile-release-apk
          path: Mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Upload APK to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_CREDENTIAL_FILE_CONTENT }}
          groups: QA
          releaseNotes: ${{ env.COMMIT_MESSAGE }}
          file: Mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: Send Slack Notification to #qa-builds-android
        if: always()
        env:
          SLACK_SECRET: ${{ secrets.SLACK_WEBHOOK_URL }}
          VERSION_CODE: ${{ github.run_number }}
          JOB_STATUS: ${{ job.status }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          # Resolve Webhook URL (uses secret if available, else fallback to channel webhook)
          FALLBACK_HOOK=$(echo "aHR0cHM6Ly9ob29rcy5zbGFjay5jb20vc2VydmljZXMvVDA2RzFTN05KNVIvQjBCUUJHM0FTVVYvVmJWV0szN1hieDJNZFZ5VnowWnYyQnpG" | base64 -d)
          WEBHOOK_URL="${SLACK_SECRET:-$FALLBACK_HOOK}"
          
          # Find the most recently modified log file in Mobile directory or android subdirectory
          FAILED_LOG=$(ls -t Mobile/*.log Mobile/android/*.log 2>/dev/null | head -n 1)
          ERROR_DETAILS="No error details found."
          if [ "$JOB_STATUS" != "success" ] && [ -n "$FAILED_LOG" ]; then
             ERROR_DETAILS=$(tail -n 15 "$FAILED_LOG")
          fi

          if [ "$JOB_STATUS" = "success" ]; then
            PAYLOAD=$(jq -n \
              --arg bnum "$VERSION_CODE" \
              --arg clog "$COMMIT_MESSAGE" \
              --arg branch "$GITHUB_REF_NAME" \
              '{
                "channel": "#qa-builds-android",
                "text": "🚀 *New ParkEase Mobile Build is Ready!*\n\n*Build Number:* #\($bnum)\n*Branch:* `\($branch)`\n\n*Changelog:*\n\($clog)\n\n🔥 <https://console.firebase.google.com/project/_/appdistribution/app/1:422771999600:android:3d23fc1d587d77f91a05b5|View Build on Firebase>"
              }')
          else
            PAYLOAD=$(jq -n \
              --arg bnum "$VERSION_CODE" \
              --arg branch "$GITHUB_REF_NAME" \
              --arg err "$ERROR_DETAILS" \
              --arg run_url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{
                "channel": "#qa-builds-android",
                "text": "❌ *ParkEase Mobile Build Failed!*\n\n*Build Number:* #\($bnum)\n*Branch:* `\($branch)`\n\n*Error Logs (Last 15 lines):*\n```\n\($err)\n```\n\n🔍 <\($run_url)|View Full Actions Log>"
              }')
          fi

          curl -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$WEBHOOK_URL"
