name: ParkEase Full-Stack CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend Build & Unit Tests (.NET 9)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Dependencies
        run: dotnet restore backend/ParkingApp.sln

      - name: Build Solution
        run: dotnet build backend/ParkingApp.sln --no-restore -c Release

      - name: Run Unit Tests
        run: dotnet test backend/tests/ParkingApp.UnitTests/ParkingApp.UnitTests.csproj --no-build -c Release --logger "trx;LogFileName=test_results.trx"

  mobile-test:
    name: Mobile Unit & Integration Tests (Jest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Mobile/package-lock.json

      - name: Install Dependencies
        working-directory: Mobile
        run: npm ci --legacy-peer-deps

      - name: Run Mobile Test Suite
        working-directory: Mobile
        run: npm test -- --ci --maxWorkers=2

  frontend-build:
    name: Frontend Lint & Build (Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint Frontend Code
        working-directory: frontend
        run: npm run lint

      - name: Build Frontend Production Bundle
        working-directory: frontend
        run: npm run build
